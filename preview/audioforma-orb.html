<title>Audioforma Orb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
  /* Single light look by design: the orb lives in a white studio room. */
  :root {
    --room: #f1f0ec;
    --panel: rgba(250, 249, 246, 0.84);
    --ink: #1d1f23;
    --on-ink: #fbfaf7;
    --muted: #5d626a;
    --hairline: rgba(29, 31, 35, 0.1);
    --hairline-strong: rgba(29, 31, 35, 0.24);
    --focus: #1b93b3;
    --error: #a3392a;
    --font-ui: "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--room);
    color: var(--ink);
    font: 400 15px/1.45 var(--font-ui);
  }
  #app, .stage { position: relative; width: 100%; height: 100%; }
  .stage > div:first-child { position: absolute !important; inset: 0; }

  .overlay {
    position: absolute;
    inset: 0;
    padding: 16px;
    display: grid;
    grid-template-columns: minmax(0, 360px) 1fr minmax(0, auto);
    grid-template-rows: auto 1fr auto;
    grid-template-areas:
      "brand . toggles"
      ". . ."
      "transport . readout";
    gap: 12px;
    pointer-events: none;
  }
  .panel {
    pointer-events: auto;
    background: var(--panel);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    box-shadow: 0 1px 2px rgba(29, 31, 35, 0.04), 0 10px 28px rgba(29, 31, 35, 0.06);
  }

  .brand { grid-area: brand; align-self: start; }
  .brand h1 {
    margin: 0 0 6px;
    font: 500 15px/1.2 var(--font-mono);
    letter-spacing: 0.04em;
    text-wrap: balance;
  }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); max-width: 40ch; }

  .toggles {
    grid-area: toggles;
    align-self: start;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 13px;
  }
  .toggles label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
  input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }

  .transport {
    grid-area: transport;
    align-self: end;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 360px;
  }
  .status {
    margin: 0;
    font: 400 11.5px/1.5 var(--font-mono);
    letter-spacing: 0.01em;
    font-variant-numeric: tabular-nums;
  }
  .buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  .primary, .secondary {
    display: inline-flex;
    align-items: center;
    font: 600 13px/1 var(--font-ui);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
  }
  .primary { background: var(--ink); color: var(--on-ink); border: 1px solid var(--ink); }
  .primary:hover { background: #33363c; }
  .primary:disabled { opacity: 0.45; cursor: progress; }
  .secondary { background: transparent; color: var(--ink); border: 1px solid var(--hairline-strong); }
  .secondary:hover { background: rgba(29, 31, 35, 0.05); }
  .hint { margin: 0; font-size: 12px; color: var(--muted); }
  .error { margin: 0; font-size: 12.5px; color: var(--error); }

  .readout {
    grid-area: readout;
    align-self: end;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr);
    align-items: center;
    gap: 8px 14px;
    width: min(340px, 100%);
  }
  .compass { display: block; max-width: 100%; height: auto; }
  .compass-label { font: 500 8.5px var(--font-mono); fill: var(--muted); }
  .readout dl { margin: 0; display: grid; gap: 7px; font-variant-numeric: tabular-nums; }
  .readout dl div { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 6px; align-items: baseline; }
  .readout dt {
    font: 400 9.5px/1.2 var(--font-mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .readout dd { margin: 0; font: 500 12.5px/1.3 var(--font-mono); }
  .readout dd span { display: block; font: 400 11px/1.3 var(--font-ui); color: var(--muted); }
  .legend-note { grid-column: 1 / -1; margin: 0; font-size: 11.5px; color: var(--muted); }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
    border: 0;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .visually-hidden:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }

  .drop {
    position: absolute;
    inset: 16px;
    display: grid;
    place-items: center;
    border: 2px dashed var(--ink);
    border-radius: 14px;
    background: rgba(241, 240, 236, 0.6);
    font: 500 15px var(--font-mono);
    pointer-events: none;
  }

  @media (max-width: 760px) {
    .overlay {
      grid-template-columns: minmax(0, 1fr);
      grid-template-rows: auto auto 1fr auto auto;
      grid-template-areas: "brand" "toggles" "." "readout" "transport";
      gap: 8px;
    }
    .brand p { font-size: 12px; }
    .toggles { flex-direction: row; flex-wrap: wrap; gap: 16px; justify-self: start; padding-block: 8px; }
    .readout { width: auto; }
    .compass { width: 112px; }
    .transport { max-width: none; }
    .hint { display: none; }
  }
  @media (max-height: 560px) and (max-width: 760px) {
    .brand p, .legend-note { display: none; }
  }
</style>
<div id="app"></div>
<script src="preview.js"></script>
