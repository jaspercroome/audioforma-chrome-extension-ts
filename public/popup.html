<!DOCTYPE html>
<html>
  <head>
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
      }
      .hint {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #666;
      }
      kbd {
        background: #f3f3f3;
        border: 1px solid #ddd;
        border-radius: 4px;
        padding: 2px 6px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="hint">
      <span>Press</span>
      <kbd>cmd/ctrl</kbd>+<kbd>shift</kbd>+<kbd>U</kbd>
      <span>to toggle the audio visualizer</span>
    </div>
  </body>
</html>
